version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: shopverse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shopverse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopverse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopverse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. NestJS Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shopverse-server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopverse_db?schema=public
      CLIENT_URL: http://localhost:80
      JWT_ACCESS_SECRET: shopverse_jwt_access_super_secret_key_2026_secure
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: shopverse_jwt_refresh_super_secret_key_2026_secure
      JWT_REFRESH_EXPIRES_IN: 7d
      VNP_TMN_CODE: SANDBOX_TMN
      VNP_HASH_SECRET: SANDBOX_SECRET
      VNP_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNP_RETURN_URL: http://localhost:80/order-result
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopverse-network

  # 3. React Frontend Client (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shopverse-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - shopverse-network

volumes:
  postgres_data:
    driver: local

networks:
  shopverse-network:
    driver: bridge
